<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pepper Ghost — видео</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      touch-action: none;
      cursor: default;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    #video {
      position: absolute;
      left: 50%;
      top: 50%;
      display: none;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      transform-origin: center;
      will-change: transform;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
    }

    #video.dragging { cursor: grabbing; }

    #controls {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 13px;
      background: rgba(12,12,12,.82);
      box-shadow: 0 10px 36px rgba(0,0,0,.46);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: translateX(-50%);
      transition: opacity .2s ease, transform .2s ease;
    }

    body.controls-hidden #controls {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
    }

    button,
    .file-button {
      min-width: 42px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 9px;
      background: rgba(255,255,255,.07);
      color: #fff;
      font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover,
    .file-button:hover { background: rgba(255,255,255,.13); }

    button:focus-visible,
    .file-button:focus-within {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .icon-button {
      padding: 0;
      font-size: 22px;
      font-weight: 400;
    }

    #zoomValue {
      min-width: 54px;
      color: rgba(255,255,255,.68);
      font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }

    #file { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    #dropOverlay {
      position: fixed;
      z-index: 20;
      inset: 14px;
      display: none;
      place-items: center;
      border: 2px dashed rgba(255,255,255,.7);
      border-radius: 18px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      pointer-events: none;
    }

    body.file-drag #dropOverlay { display: grid; }

    @media (max-width: 560px) {
      #controls { bottom: max(10px, env(safe-area-inset-bottom)); }
      .button-text { display: none; }
      button, .file-button { padding: 0 11px; }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Полноэкранная сцена Pepper Ghost">
    <video id="video" loop muted playsinline preload="metadata"></video>
  </main>

  <nav id="controls" aria-label="Управление видео">
    <label class="file-button" title="Выбрать видео">
      <span aria-hidden="true">＋</span><span class="button-text">Видео</span>
      <input id="file" type="file" accept="video/*">
    </label>
    <button id="zoomOut" class="icon-button" type="button" aria-label="Уменьшить видео" title="Уменьшить (−)">−</button>
    <output id="zoomValue" aria-live="polite">100%</output>
    <button id="zoomIn" class="icon-button" type="button" aria-label="Увеличить видео" title="Увеличить (+)">+</button>
    <button id="fullscreen" type="button" title="На весь экран (F)"><span aria-hidden="true">⛶</span><span class="button-text">Весь экран</span></button>
  </nav>

  <div id="dropOverlay">Отпустите видео</div>

  <script>
    "use strict";

    const video = document.querySelector("#video");
    const fileInput = document.querySelector("#file");
    const zoomValue = document.querySelector("#zoomValue");
    const fullscreenButton = document.querySelector("#fullscreen");

    const state = { x: 0, y: 0, scale: 1 };
    const pointers = new Map();
    let objectUrl = "";
    let dragStart = null;
    let pinchStart = null;
    let controlsTimer = 0;
    let dragDepth = 0;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function render() {
      video.style.transform = `translate(-50%, -50%) translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
      zoomValue.value = `${Math.round(state.scale * 100)}%`;
      zoomValue.textContent = zoomValue.value;
    }

    function setScale(nextScale) {
      state.scale = clamp(nextScale, 0.1, 8);
      render();
    }

    function resetPlacement() {
      state.x = 0;
      state.y = 0;
      state.scale = 1;
      render();
    }

    function fitVideo() {
      const sourceWidth = video.videoWidth || 1920;
      const sourceHeight = video.videoHeight || 1080;
      const maxWidth = window.innerWidth * 0.72;
      const maxHeight = window.innerHeight * 0.72;
      const ratio = Math.min(maxWidth / sourceWidth, maxHeight / sourceHeight);
      video.style.width = `${Math.max(1, sourceWidth * ratio)}px`;
      video.style.height = `${Math.max(1, sourceHeight * ratio)}px`;
      resetPlacement();
    }

    function showControls(autoHide = true) {
      document.body.classList.remove("controls-hidden");
      window.clearTimeout(controlsTimer);
      if (autoHide && !video.paused && video.src) {
        controlsTimer = window.setTimeout(() => {
          document.body.classList.add("controls-hidden");
        }, 2400);
      }
    }

    async function startVideo(file) {
      if (!file || !file.type.startsWith("video/")) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      video.src = objectUrl;
      video.style.display = "block";
      video.load();
      try { await video.play(); } catch (_) { showControls(false); }
      showControls();
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          const root = document.documentElement;
          if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: "hide" });
          else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
        } else if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (_) {
        showControls(false);
      }
    }

    function updateFullscreenLabel() {
      const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      fullscreenButton.querySelector(".button-text").textContent = active ? "Выйти" : "Весь экран";
      showControls();
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function midpoint(a, b) {
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    video.addEventListener("loadedmetadata", fitVideo);
    video.addEventListener("play", () => showControls());
    video.addEventListener("pause", () => showControls(false));

    video.addEventListener("pointerdown", (event) => {
      video.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      video.classList.add("dragging");

      if (pointers.size === 1) {
        dragStart = { pointerX: event.clientX, pointerY: event.clientY, x: state.x, y: state.y };
      } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinchStart = {
          distance: distance(a, b),
          center: midpoint(a, b),
          scale: state.scale,
          x: state.x,
          y: state.y
        };
      }
      showControls();
    });

    video.addEventListener("pointermove", (event) => {
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (pointers.size === 1 && dragStart) {
        state.x = dragStart.x + event.clientX - dragStart.pointerX;
        state.y = dragStart.y + event.clientY - dragStart.pointerY;
        render();
      } else if (pointers.size === 2 && pinchStart) {
        const [a, b] = [...pointers.values()];
        const center = midpoint(a, b);
        state.x = pinchStart.x + center.x - pinchStart.center.x;
        state.y = pinchStart.y + center.y - pinchStart.center.y;
        state.scale = clamp(pinchStart.scale * distance(a, b) / Math.max(1, pinchStart.distance), 0.1, 8);
        render();
      }
    });

    function releasePointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size === 0) {
        dragStart = null;
        pinchStart = null;
        video.classList.remove("dragging");
        showControls();
      } else if (pointers.size === 1) {
        const [point] = pointers.values();
        dragStart = { pointerX: point.x, pointerY: point.y, x: state.x, y: state.y };
        pinchStart = null;
      }
    }

    video.addEventListener("pointerup", releasePointer);
    video.addEventListener("pointercancel", releasePointer);

    window.addEventListener("wheel", (event) => {
      if (!video.src) return;
      event.preventDefault();
      setScale(state.scale * Math.exp(-event.deltaY * 0.0015));
      showControls();
    }, { passive: false });

    fileInput.addEventListener("change", () => startVideo(fileInput.files[0]));
    document.querySelector("#zoomOut").addEventListener("click", () => { setScale(state.scale / 1.15); showControls(); });
    document.querySelector("#zoomIn").addEventListener("click", () => { setScale(state.scale * 1.15); showControls(); });
    fullscreenButton.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", updateFullscreenLabel);
    document.addEventListener("webkitfullscreenchange", updateFullscreenLabel);
    document.addEventListener("pointermove", () => showControls());
    document.addEventListener("pointerdown", () => showControls());
    window.addEventListener("resize", render);

    document.addEventListener("dblclick", (event) => {
      if (!event.target.closest("#controls")) toggleFullscreen();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "f") toggleFullscreen();
      if (event.key === "+" || event.key === "=") setScale(state.scale * 1.15);
      if (event.key === "-" || event.key === "_") setScale(state.scale / 1.15);
      if (event.key.toLowerCase() === "h") document.body.classList.toggle("controls-hidden");
      if (event.code === "Space" && video.src) {
        event.preventDefault();
        video.paused ? video.play() : video.pause();
      }
    });

    window.addEventListener("dragenter", (event) => {
      event.preventDefault();
      dragDepth += 1;
      document.body.classList.add("file-drag");
    });

    window.addEventListener("dragover", (event) => event.preventDefault());

    window.addEventListener("dragleave", (event) => {
      event.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) document.body.classList.remove("file-drag");
    });

    window.addEventListener("drop", (event) => {
      event.preventDefault();
      dragDepth = 0;
      document.body.classList.remove("file-drag");
      const file = [...event.dataTransfer.files].find((item) => item.type.startsWith("video/"));
      startVideo(file);
    });

    window.addEventListener("beforeunload", () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    });

    render();
  </script>
</body>
</html>
